[package]
name = "aitextsense"
version = "3.0.0"
description = "AI TextSense — Forensic Text & Prompt Injection Inspector"
authors = ["AI TextSense"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
