name: Release Build Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            artifact-pattern: 'src-tauri/target/release/bundle/nsis/*.exe'
          - platform: 'ubuntu-22.04'
            args: ''
            artifact-pattern: 'src-tauri/target/release/bundle/appimage/*.AppImage,src-tauri/target/release/bundle/deb/*.deb'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            artifact-pattern: 'src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Frontend dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI TextSense ${{ github.ref_name }}'
          releaseBody: |
            ## AI TextSense ${{ github.ref_name }} Multi-Platform Release

            ### 📦 Official Installation Packages:
            - **Windows**: NSIS Installer (`.exe`) and Portable standalone binary.
            - **Linux**: Universal AppImage (`.AppImage`) and Debian package (`.deb`).
            - **macOS**: Universal Apple Silicon + Intel disk image (`.dmg`).

            All releases are licensed under **Apache-2.0** with air-gapped on-device AI inspection.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

